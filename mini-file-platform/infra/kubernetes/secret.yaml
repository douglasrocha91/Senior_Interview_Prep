# Secret template — copy to secret.local.yaml, fill values, never commit real keys.
# Apply with: kubectl apply -f infra/kubernetes/secret.local.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mini-file-platform-aws
  namespace: mini-file-platform
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
